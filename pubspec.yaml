name: app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  
  # For Network
  dio: ^5.8.0+1
  connectivity_plus: ^7.0.0

  # Snacbar 
  top_snackbar_flutter: ^3.3.0

  # Icons and images
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7+1
  # Local storage (works on Android, iOS and Web)
  shared_preferences: ^2.3.2

  #  spamming the API
  stream_transform: ^2.1.1
  bloc_concurrency: ^0.3.0

  image_picker: ^1.1.2

  # video player
  video_player: ^2.10.0
  chewie: ^1.12.1
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  youtube_player_iframe: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.5.4
  freezed: ^3.1.0
  # bloc_test: ^10.0.0
  # build_runner: any
  # freezed: any

  

  # Isar code generation
  # isar_generator: ^3.1.0+1


flutter:


  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/

    - assets/translations/
    - assets/translations/en.json
    - assets/translations/ru.json
    - assets/translations/uz-Latn.json
    - assets/translations/uz-Cyrl.json

flutter_assets:
  assets_path: assets/
  output_path: lib/config/
  filename: assets.dart

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
